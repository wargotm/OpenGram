name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply OpenGram changes
        run: |
          cp OpenGramSettingsActivity.java TMessagesProj/src/main/java/org/telegram/ui/
          python3 opengram_patch.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: |
          SDKM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "ndk;27.2.12479018" "build-tools;36.0.0" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon 2>&1 | tee build.log
      - name: Errors summary
        if: failure()
        run: |
          grep -n -E "error:|What went wrong|Execution failed|FAILED|cannot find symbol" -A4 build.log | head -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"