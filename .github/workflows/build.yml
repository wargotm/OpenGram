          ('OpenGramSettings','OpenGram'),('OpenGramSettingsInfo','Liquid Glass, verification badge'),('OpenGramVerifiedSettings','Verification badge'),('OpenGramVerifiedMajor','Major badge'),('OpenGramVerifiedInfo','Shows a verification badge next to your name. The badge is local and visible only to you on this device.')]
